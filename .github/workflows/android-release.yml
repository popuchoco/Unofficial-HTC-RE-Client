name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Validate release tag and signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          if [[ -z "$app_version" || "$app_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match app/build.gradle versionName (found: ${app_version:-missing})." >&2
            exit 1
          fi
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing repository Actions secret: $secret_name (see docs/RELEASE.md)." >&2
              exit 1
            fi
          done

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/re-lens-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Verify signature and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path is not set}}"
          "$sdk_root/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          version="${GITHUB_REF_NAME#v}"
          asset="RE-Lens-v${version}.apk"
          cp "$apk" "$RUNNER_TEMP/$asset"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$asset" > "$asset.sha256"
          )
          printf '%s\n' \
            "## RE Lens $GITHUB_REF_NAME" \
            '' \
            '- Signed release APK for sideload installation.' \
            '- SHA-256 checksum is provided alongside the APK.' \
            '- Minimum Android version: Android 8.0 (API 26).' \
            '' \
            'For installation and compatibility details, see the repository README and connection guide.' \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          apk="$RUNNER_TEMP/RE-Lens-${tag}.apk"
          checksum="$apk.sha256"
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" "$checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "RE Lens $tag" \
              --notes-file "$notes"
          fi
