plugins { id 'com.android.application' }

android {
    namespace 'tw.xiaoxin.relens'
    compileSdk 35
    defaultConfig {
        applicationId 'tw.xiaoxin.relens'
        minSdk 26
        // Android 12 Bluetooth permissions without target 33's Wi-Fi permission path.
        targetSdk 32
        versionCode 47
        versionName '0.6.3'
    }
    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint {
        // ADR-003 intentionally holds target 32 until the P2P hardware matrix passes.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
